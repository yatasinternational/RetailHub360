<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yataş Group - SellTrackIQ B2B Proforma & POS</title>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS & Supabase JS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { background-color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; color: #0f172a; }
        .bg-yatas-navy { background-color: #00205b; }
        .bg-yatas-dark-navy { background-color: #00153e; }
        .ui-card { background-color: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 4px 20px -2px rgba(0, 32, 91, 0.05); }
        .btn-navy { background-color: #00205b; color: #ffffff; transition: all 0.2s ease; }
        .btn-navy:hover { background-color: #00143d; }
    </style>
</head>
<body class="h-full flex flex-col min-h-screen bg-slate-50 text-slate-900">

    <!-- PROFORMA SİPARİŞ MODAL -->
    <div id="proformaModal" class="fixed inset-0 bg-[#00153e]/80 backdrop-blur-md z-[9999] flex items-center justify-center p-4 hidden">
        <div class="bg-white border border-slate-200 w-full max-w-2xl rounded-2xl p-6 shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-slate-200 pb-3">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-[#00205b] text-white flex items-center justify-center font-black">
                        <i class="fa-solid fa-file-invoice"></i>
                    </div>
                    <div>
                        <h3 class="text-base font-extrabold text-[#00205b]">Yataş B2B Proforma Order Draft</h3>
                        <p class="text-xs text-slate-500 font-semibold" id="proformaInvoiceNo">Doc: PRF-2026-0001</p>
                    </div>
                </div>
                <button onclick="closeProformaModal()" class="text-slate-400 hover:text-slate-800 font-bold px-2.5 py-1 bg-slate-100 rounded-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Proforma İçerik Özet -->
            <div class="space-y-3">
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 grid grid-cols-2 gap-4 text-xs font-semibold">
                    <div>
                        <span class="text-slate-400 block text-[10px] uppercase font-bold">Bayi Bilgisi</span>
                        <span id="profDealerName" class="font-extrabold text-[#00205b] block">--</span>
                    </div>
                    <div>
                        <span class="text-slate-400 block text-[10px] uppercase font-bold">Oluşturma Tarihi</span>
                        <span id="profDate" class="font-bold text-slate-800 block">04.08.2026</span>
                    </div>
                </div>

                <div class="border border-slate-200 rounded-xl overflow-hidden">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-slate-100 text-slate-600 font-extrabold uppercase text-[10px]">
                            <tr>
                                <th class="p-3">SKU & Ürün</th>
                                <th class="p-3 text-center">Sipariş Miktarı</th>
                                <th class="p-3 text-right">Birim Fiyat</th>
                                <th class="p-3 text-right">Toplam Tutar</th>
                            </tr>
                        </thead>
                        <tbody id="proformaTableBody" class="divide-y divide-slate-100 font-semibold text-slate-700"></tbody>
                    </table>
                </div>

                <div class="flex items-center justify-between bg-emerald-50 p-4 rounded-xl border border-emerald-200">
                    <span class="text-xs font-bold text-emerald-800 uppercase">Toplam Proforma Tutar:</span>
                    <span id="profTotalAmount" class="text-lg font-black text-emerald-700">$0.00</span>
                </div>
            </div>

            <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-200">
                <button onclick="closeProformaModal()" class="px-4 py-2 bg-slate-100 text-slate-600 font-bold rounded-xl text-xs hover:bg-slate-200">İptal</button>
                <button onclick="confirmAndSendProformaOrder()" class="px-5 py-2.5 bg-[#00205b] text-white font-extrabold rounded-xl text-xs hover:bg-[#00153e] transition shadow flex items-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i> Proformayı Onayla & SAP'ye Gönder
                </button>
            </div>
        </div>
    </div>

    <!-- MAIN PORTAL WRAPPER (Devamı mevcut kodunuzla aynı yapıda akmaktadır) -->
    <script>
        let currentProformaItem = null;

        function generateProformaDraft(productId, recommendedOrder) {
            const product = globalProducts.find(p => p.id === productId);
            if (!product) return;

            currentProformaItem = { product, qty: recommendedOrder };

            document.getElementById('proformaInvoiceNo').innerText = `Doc: PRF-2026-${Math.floor(1000 + Math.random() * 9000)}`;
            document.getElementById('profDealerName').innerText = currentDealer ? currentDealer.name : 'Yataş Dealer';
            document.getElementById('profDate').innerText = new Date().toLocaleDateString('tr-TR');

            const tbody = document.getElementById('proformaTableBody');
            const total = recommendedOrder * product.price;

            tbody.innerHTML = `
                <tr>
                    <td class="p-3">
                        <span class="font-mono font-black text-[#00205b] block text-[10px]">${product.code}</span>
                        <span class="font-bold text-slate-800">${product.name}</span>
                    </td>
                    <td class="p-3 text-center font-black text-[#00205b]">${recommendedOrder} Pcs</td>
                    <td class="p-3 text-right font-bold">$${product.price}</td>
                    <td class="p-3 text-right font-black text-emerald-600">$${total}</td>
                </tr>
            `;

            document.getElementById('profTotalAmount').innerText = `$${total.toFixed(2)}`;
            document.getElementById('proformaModal').classList.remove('hidden');
        }

        function closeProformaModal() {
            document.getElementById('proformaModal').classList.add('hidden');
        }

        async function confirmAndSendProformaOrder() {
            if (!currentProformaItem) return;

            try {
                // Supabase Sipariş Kaydı
                await supabaseClient.from('shipments').insert([{
                    dealer_code: currentDealer.code,
                    invoice_no: `PRF-${Math.floor(100000 + Math.random() * 900000)}`,
                    product_code: currentProformaItem.product.code,
                    product_name: currentProformaItem.product.name,
                    quantity: currentProformaItem.qty,
                    status: 'PENDING'
                }]);

                alert('B2B Proforma Siparişiniz Başarıyla Oluşturuldu ve SAP Sistemine İletildi!');
                closeProformaModal();
                fetchPendingShipments();
            } catch (ex) {
                console.error("Proforma Error:", ex);
                alert("Sipariş iletilirken hata oluştu.");
            }
        }
    </script>
</body>
</html>
